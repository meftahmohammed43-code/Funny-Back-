<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائج الباك 2026</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    padding:20px;
}

.box{
    background:white;
    max-width:400px;
    margin:auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

input{
    width:90%;
    padding:12px;
    margin:8px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h1>🎓 نتائج الباك 2026 😂</h1>

<input type="text" id="nom" placeholder="الاسم"><br>
<input type="text" id="prenom" placeholder="اللقب"><br>

<button onclick="calculer()">إظهار النتيجة</button>

<div id="result"></div>
</div>

<script>
function calculer() {

let nom = document.getElementById("nom").value;
let prenom = document.getElementById("prenom").value;

let moyenne = (Math.random()*20).toFixed(2);

let message="";

if(moyenne < 5){
message="😂 روح ڨاجي مشي خير لك";
}
else if(moyenne < 8){
message="⚽ متمشيش تلعب";
}
else if(moyenne < 10){
message="📢 جيبو باك جييو باك";
}
else if(moyenne < 12){
message="💪 أنت تستطيع";
}
else if(moyenne < 15){
message="👏 بصحتك تستاهل";
}
else if(moyenne < 18){
message="😎 أنت قوي";
}
else{
message="🎉🎓 مبروككككك طلعت جامعععععة";
}

document.getElementById("result").innerHTML=
"👤 "+nom+" "+prenom+
"<br><br>📊 معدلك هو: "+moyenne+"/20"+
"<br><br>"+message;
}
</script>

</body>
  </html>
